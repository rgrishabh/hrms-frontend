# Static SPA server. Runs unprivileged on :8080 with a read-only root filesystem; runtime
# files (index.html, env.js, manifest, icon, security headers) are generated into /tmp/hrms at start.
# The reverse proxy in front (Caddy in dev, the ALB in prod) sends /api, /health, /ready, /brand
# and /branding to the backend on the SAME origin (session cookie + CSRF).

# Brotli without a module: the build writes .br files next to each hashed asset, and these maps pick them.
map $http_accept_encoding $hrms_br_suffix { default ""; "~*(^|[\s,])br($|[\s,;])" ".br"; }
map $http_accept_encoding $hrms_br_encoding { default ""; "~*(^|[\s,])br($|[\s,;])" "br"; }

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;
    charset utf-8;

    # Gzip: pre-built .gz where they exist, on the fly for anything else.
    gzip on;
    gzip_static on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css application/javascript application/json application/manifest+json image/svg+xml;
    types {
        text/html html;
        text/css css;
        application/javascript js;
        application/json json;
        application/manifest+json webmanifest;
        image/svg+xml svg;
        image/png png;
        image/x-icon ico;
        font/woff2 woff2;
        text/plain txt;
    }

    include /tmp/hrms/headers.conf;

    location = /healthz { access_log off; default_type text/plain; return 200 "ok\n"; }

    location = /env.js              { include /tmp/hrms/headers.conf; add_header Cache-Control "no-store" always; alias /tmp/hrms/env.js; }
    location = /index.html          { include /tmp/hrms/headers.conf; add_header Cache-Control "no-cache" always; alias /tmp/hrms/index.html; }
    location = /manifest.webmanifest { include /tmp/hrms/headers.conf; add_header Cache-Control "no-cache" always; alias /tmp/hrms/manifest.webmanifest; }
    location = /icon.svg            { include /tmp/hrms/headers.conf; add_header Cache-Control "no-cache" always; alias /tmp/hrms/icon.svg; }
    # A stale service worker must never outlive a release.
    location = /sw.js               { include /tmp/hrms/headers.conf; add_header Cache-Control "no-cache" always; }

    # Hashed JS and CSS: immutable, brotli when the browser accepts it.
    location ~ ^/assets/.+\.js$ {
        include /tmp/hrms/headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header Content-Encoding $hrms_br_encoding always;
        add_header Vary "Accept-Encoding" always;
        types { } default_type application/javascript;
        gzip off;
        try_files $uri$hrms_br_suffix =404;
    }
    location ~ ^/assets/.+\.css$ {
        include /tmp/hrms/headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header Content-Encoding $hrms_br_encoding always;
        add_header Vary "Accept-Encoding" always;
        types { } default_type text/css;
        gzip off;
        try_files $uri$hrms_br_suffix =404;
    }
    location /assets/ {
        include /tmp/hrms/headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # The API and brand files never live here; a misrouted call must not get the SPA.
    location ~ ^/(api|health|ready|brand|branding)(/|$) { return 404; }

    location / {
        include /tmp/hrms/headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri /index.html;
    }
}
