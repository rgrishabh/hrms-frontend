# Static SPA server. Runs unprivileged on :8080 with a read-only root filesystem; runtime
# files (index.html, env.js, security headers) are generated into /tmp/hrms at start.
# The reverse proxy in front (Caddy in dev, the ALB in prod) sends /api, /health, /ready
# and /branding to the backend on the SAME origin (session cookie + CSRF).
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;
    charset utf-8;

    include /tmp/hrms/headers.conf;

    location = /healthz { access_log off; default_type text/plain; return 200 "ok\n"; }

    location = /env.js     { include /tmp/hrms/headers.conf; add_header Cache-Control "no-store" always; alias /tmp/hrms/env.js; }
    location = /index.html { include /tmp/hrms/headers.conf; add_header Cache-Control "no-cache" always; alias /tmp/hrms/index.html; }

    location /assets/ {
        include /tmp/hrms/headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # The API never lives here; a misrouted API call must not get the SPA.
    location ~ ^/(api|health|ready|branding)(/|$) { return 404; }

    location / {
        include /tmp/hrms/headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri /index.html;
    }
}
