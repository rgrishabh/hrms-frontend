name: Release
# Push to main: release-please opens/updates the release PR (Conventional Commits).
# Merging it tags vX.Y.Z; this workflow then publishes :vX.Y.Z and :latest for both architectures (signed) and
# sends repository_dispatch "release-prod": hrms-deployment opens the production version PR. A manually pushed v* tag does the same.
# Stay on _app-publish.yml@main: deploy-prod and rollback-prod verify the cosign identity of exactly that workflow and ref.
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
permissions: {}
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  release-please:
    if: github.ref_type == 'branch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    outputs:
      created: ${{ steps.rp.outputs.release_created }}
      tag: ${{ steps.rp.outputs.tag_name }}
    steps:
      - id: rp
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          # A PAT/App token makes CI run on the release PR; with GITHUB_TOKEN an admin merges it (ruleset bypass).
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || github.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
  publish:
    needs: release-please
    if: always() && (github.ref_type == 'tag' || needs.release-please.outputs.created == 'true')
    permissions:
      contents: read
      packages: write
      id-token: write
    uses: rgrishabh/hrms-deployment/.github/workflows/_app-publish.yml@main
    with:
      app: frontend
      mode: release
      version: ${{ github.ref_type == 'tag' && github.ref_name || needs.release-please.outputs.tag }}
      platforms: linux/amd64,linux/arm64
    secrets:
      DEPLOY_APP_PRIVATE_KEY: ${{ secrets.DEPLOY_APP_PRIVATE_KEY }}
      DEPLOY_REPO_TOKEN: ${{ secrets.DEPLOY_REPO_TOKEN }}
