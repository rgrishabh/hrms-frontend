name: E2E
# Browser tests of the production build. The mocked suite needs no backend. The full suite runs against a checkout
# of hrms-backend on a throwaway database with its SYNTHETIC demo data: playwright.config.ts starts e2e/full/stack.mjs
# for each profile, which resets the database, seeds it, and starts the API, worker and mail sink.
# Node 24 for the full suite: the backend needs it.
on:
  pull_request:
    branches: [develop, main]
  workflow_dispatch:
    inputs:
      backend_ref:
        description: hrms-backend ref to test against
        type: string
        default: main

permissions: {}

concurrency:
  group: e2e-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  mock:
    name: Mocked browser suite
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npm run e2e:mock
      # In the image the Linux baselines were made in, as fonts render differently elsewhere.
      - name: Visual baselines
        run: |
          docker run --rm -v "$PWD":/w -v /w/node_modules -v /w/test-results -w /w \
            mcr.microsoft.com/playwright:v1.64.1-noble \
            sh -c 'npm ci --no-audit --no-fund && npm run e2e:visual'
      - if: ${{ failure() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-mock
          path: test-results/
          retention-days: 7
          if-no-files-found: ignore

  full:
    name: Full stack
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: ci-postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      E2E_BACKEND_DIR: ${{ github.workspace }}/.backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check out the backend
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: rgrishabh/hrms-backend
          ref: ${{ inputs.backend_ref || 'main' }}
          path: .backend
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            .backend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: Install the backend
        working-directory: .backend
        run: npm ci --no-audit --no-fund
      - name: Roles and database (passwords generated per run)
        env:
          PGPASSWORD: ci-postgres
        run: |
          owner_pw=$(openssl rand -hex 16); app_pw=$(openssl rand -hex 16)
          echo "::add-mask::$owner_pw"; echo "::add-mask::$app_pw"
          psql -h 127.0.0.1 -U postgres -v ON_ERROR_STOP=1 \
            -c "CREATE ROLE hrms_owner LOGIN PASSWORD '$owner_pw' NOSUPERUSER NOBYPASSRLS" \
            -c "CREATE ROLE hrms_app LOGIN PASSWORD '$app_pw' NOSUPERUSER NOBYPASSRLS" \
            -c "CREATE DATABASE hrms_e2e OWNER hrms_owner"
          {
            echo "E2E_DB_OWNER_URL=postgres://hrms_owner:$owner_pw@127.0.0.1:5432/hrms_e2e"
            echo "E2E_DB_APP_URL=postgres://hrms_app:$app_pw@127.0.0.1:5432/hrms_e2e"
          } >> "$GITHUB_ENV"
      - run: npx playwright install --with-deps chromium
      - id: build
        run: npm run build
      # Each profile keeps its report apart, and a failure in one does not hide the others.
      - name: Profile full, desktop and mobile
        env:
          E2E_PROFILE: full
          PLAYWRIGHT_HTML_OUTPUT_DIR: playwright-report/full
        run: npx playwright test --project=desktop --project=mobile --output=test-results/full
      - name: Profile off
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        env:
          E2E_PROFILE: "off"
          PLAYWRIGHT_HTML_OUTPUT_DIR: playwright-report/off
        run: npx playwright test --output=test-results/off
      - name: Profile single
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        env:
          E2E_PROFILE: single
          PLAYWRIGHT_HTML_OUTPUT_DIR: playwright-report/single
        run: npx playwright test --output=test-results/single
      - if: ${{ failure() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-full
          path: |
            playwright-report/
            test-results/
          retention-days: 7
          if-no-files-found: ignore
